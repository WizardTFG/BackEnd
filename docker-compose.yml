services:
  db:
    image: postgres:15-alpine
    container_name: wizard_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-wizard_db}
      POSTGRES_USER: ${DB_USER:-wizard_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wizard_user} -d ${DB_NAME:-wizard_db}"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: wizard_backend

    restart: unless-stopped

    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy


  frontend:
    build:
      context: ../FrontEnd
      dockerfile: Dockerfile

    container_name: wizard_frontend

    restart: unless-stopped

    volumes:
      - ../FrontEnd:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    environment:
      - VITE_API_URL=http://localhost:8000/api

    command: npm run dev -- --host 0.0.0.0

    depends_on:
      - backend


volumes:
  postgres_data: